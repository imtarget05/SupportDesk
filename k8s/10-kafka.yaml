apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportdesk-kafka
  namespace: portfolio
  labels:
    app: supportdesk-kafka
    role: message-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supportdesk-kafka
  template:
    metadata:
      labels:
        app: supportdesk-kafka
        role: message-broker
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
        - name: client
          containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        # Heap kept below the memory limit (1Gi) so off-heap buffers, KRaft
        # controller state and the OS page cache still fit — 512Mi with the
        # default heap previously OOMKilled the broker every few minutes.
        - name: KAFKA_HEAP_OPTS
          value: "-Xms512M -Xmx768M"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://supportdesk-kafka:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_NUM_PARTITIONS
          value: "3"
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: supportdesk-kafka
  namespace: portfolio
  labels:
    app: supportdesk-kafka
spec:
  type: ClusterIP
  selector:
    app: supportdesk-kafka
  ports:
  - name: client
    port: 9092
    targetPort: 9092
