apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportdesk-backend
  namespace: portfolio
  labels:
    app: supportdesk-backend
    role: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supportdesk-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: supportdesk-backend
        role: api
    spec:
      serviceAccountName: portfolio-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: supportdesk-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: SUPPORTDESK_DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: JWT_SECRET
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "supportdesk-kafka:9092"
        - name: AI_PROVIDER
          value: "stub"
        - name: AI_EMBED_PROVIDER
          value: "bow"
        - name: ALEMBIC_MIGRATE
          value: "false"
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: supportdesk-backend
  namespace: portfolio
  labels:
    app: supportdesk-backend
spec:
  type: ClusterIP
  selector:
    app: supportdesk-backend
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supportdesk-backend
  namespace: portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supportdesk-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
