# SupportDesk — Render Blueprint: API (Docker) + Managed Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Secrets: JWT_SECRET is auto-generated; DATABASE_URL injected from the db.
# CORS_ORIGINS is pinned to the canonical Cloudflare Pages origin below.
#
# CANONICAL PRODUCTION BACKEND: https://supportdesk-api-kh02.onrender.com
#   The older supportdesk-api-zpkv.onrender.com instance is SUSPENDED and must
#   never be referenced in workflows, frontend build env, smoke tests or docs.
# CORS_ORIGINS value for the live service:
#   https://supportdesk-cta.pages.dev  (must equal the canonical Pages origin)
services:
  - type: web
    name: supportdesk-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALEMBIC_MIGRATE
        value: "true"
      # D5: production provider is OpenAI — pinned in the blueprint so nobody
      # has to flip it in the dashboard. Boot-safe without a key: the provider
      # is constructed lazily on the first AI call, so the service boots and
      # /api/health stays green; triage/draft answer 502 with
      # "OPENAI_API_KEY is not set" until the key below is filled in.
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # Hard stop at the approved $10/month budget (DECISIONS.md D5/D8).
      - key: AI_MONTHLY_BUDGET_USD
        value: "10"
      - key: AI_EMBED_PROVIDER
        value: bow
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: START_BACKGROUND_WORKERS
        value: "true"
      - key: CORS_ORIGINS
        value: https://supportdesk-cta.pages.dev
databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
    plan: free
