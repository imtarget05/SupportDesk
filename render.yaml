# SupportDesk — Render Blueprint: API (Docker) + Managed Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Secrets: JWT_SECRET is auto-generated; DATABASE_URL injected from the db.
# CORS_ORIGINS must be set manually to the Cloudflare Pages URL after Pages deploy.
services:
  - type: web
    name: supportdesk-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALEMBIC_MIGRATE
        value: "true"
      - key: AI_PROVIDER
        value: stub
      - key: AI_EMBED_PROVIDER
        value: bow
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: START_BACKGROUND_WORKERS
        value: "true"
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
    plan: free
