# SupportDesk — Render Blueprint: API (Docker) + Managed Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Secrets: JWT_SECRET is auto-generated; DATABASE_URL injected from the db.
# CORS_ORIGINS is pinned to the canonical Cloudflare Pages origin below.
#
# CANONICAL PRODUCTION BACKEND: https://supportdesk-api-kh02.onrender.com
#   The older supportdesk-api-zpkv.onrender.com instance is SUSPENDED and must
#   never be referenced in workflows, frontend build env, smoke tests or docs.
# CORS_ORIGINS value for the live service:
#   https://supportdesk-cta.pages.dev  (must equal the canonical Pages origin)
services:
  - type: web
    name: supportdesk-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALEMBIC_MIGRATE
        value: "true"
      - key: AI_PROVIDER
        value: stub
      - key: AI_EMBED_PROVIDER
        value: bow
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: START_BACKGROUND_WORKERS
        value: "true"
      - key: CORS_ORIGINS
        value: https://supportdesk-cta.pages.dev
databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
    plan: free
