# SupportDesk — production-like stack
# Usage:
#   export JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"  # 64 hex chars, once per shell
#   docker compose up -d --build          # postgres + backend + frontend (prod)
#   docker compose --profile build up frontend-build  # one-off frontend build via container (optional)
# Repo-root context required: docker build -f backend/Dockerfile .
# JWT_SECRET has NO default on purpose — compose fails fast if it is unset,
# so a prod-like deploy can never silently run with a public dev secret.

services:
  # ── Infrastructure ──────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: on-failure

  # ── Backend (FastAPI) ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - AI_PROVIDER=stub
      - AI_EMBED_PROVIDER=bow
      - DATABASE_URL=postgresql://supportdesk:supportdesk@db:5432/supportdesk
      - ALEMBIC_MIGRATE=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - export a 32+ char secret before 'docker compose up'}
    ports:
      - "127.0.0.1:8000:8000"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

# ── Vector store for knowledge-base RAG (optional) ───────────────────
  # The app falls back to its in-process LlamaIndex index when this is absent
  # or unreachable, so the stack starts and works without it.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: on-failure

  # ── Durable workflows (optional) ─────────────────────────────────────
  # With TEMPORAL_ENABLED=false the backend uses its in-process activity
  # runner, which executes the same workflow definitions.
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=sqlite
      - DB_FILE_PATH=/data/temporal.db
    ports:
      - "7233:7233"
    volumes:
      - temporaldata:/data
    restart: on-failure
# ── API gateway (TypeScript) ────────────────────────────────────────
  # Verifies JWTs and proxies /api to the backend, so auth is enforced before
  # any request — including an AI call — reaches the Python service.
  gateway:
    build:
      context: ./gateway
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:8000
      - BACKEND_TIMEOUT_MS=30000
      # Signs and verifies the same tokens; no default on purpose.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy

  # ── Frontend (Nginx serving dist + proxy /api) ──
  # ── Frontend (Nginx serving dist + proxy /api) ──
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: on-failure

  # ── One-off builder (optional, not run by default) ──
  frontend-build:
    image: node:20-alpine
    working_dir: /srv/frontend
    volumes:
      - ./frontend:/srv/frontend:ro
    command: ["npm", "run", "build"]
    profiles: ["build"]

volumes:
  pgdata:
  qdrantdata:
  temporaldata:
