name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    # Run on manual dispatch OR when CI workflow completes successfully on main.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/imtarget05/supportdesk:${{ github.sha }}
            ghcr.io/imtarget05/supportdesk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            BUILDKIT_PROGRESS=plain

      - name: Redeploy on Render
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY / RENDER_SERVICE_ID secrets not configured — production backend cannot be redeployed. A skipped deploy must never count as success. Add both secrets (target the canonical kh02 service) or remove this job deliberately."
            exit 1
          fi
          echo "Triggering redeploy on Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "ERROR: Render redeploy failed (HTTP ${HTTP_CODE})"
            echo "$BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          fi
          echo "Render redeploy triggered: $BODY"

      - name: Wait for Render deploy + poll /api/health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Render secrets not configured — cannot poll production health. Failing loudly instead of skipping."
            exit 1
          fi

          SERVICE_HOST=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            | jq -r '.serviceDetails.url // empty')
          if [ -z "$SERVICE_HOST" ]; then
            echo "ERROR: Could not get service URL from Render API"
            exit 1
          fi
          echo "Service URL: ${SERVICE_HOST}"

          DEPLOY_ID="${{ steps.render.outputs.deploy_id }}"
          if [ -n "$DEPLOY_ID" ]; then
            echo "Waiting for Render deploy ${DEPLOY_ID} to go live (max 20 min)..."
            for i in $(seq 1 40); do
              STATUS=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
                | jq -r '.status // empty')
              echo "Attempt $i/40 — deploy status: ${STATUS:-unknown}"
              if [ "$STATUS" = "live" ]; then
                echo "✓ Render deploy is live"
                break
              fi
              if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "deactivated" ]; then
                echo "✗ Render deploy ended with status: ${STATUS}"
                exit 1
              fi
              sleep 30
            done
            if [ "$STATUS" != "live" ]; then
              echo "✗ Deploy did not reach 'live' within 20 minutes"
              exit 1
            fi
          fi

          echo "Polling ${SERVICE_HOST}/api/health ..."
          for i in $(seq 1 10); do
            if curl -sf --max-time 10 "${SERVICE_HOST}/api/health" | grep -q '"status":"ok"'; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 — not ready yet"
            sleep 15
          done
          echo "✗ Health check FAILED"
          exit 1

  frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        env:
          # Canonical production backend (supportdesk-api-zpkv is suspended and
          # must never be a fallback). Override via repo variable VITE_API_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://supportdesk-api-kh02.onrender.com' }}
        run: |
          cd frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'supportdesk' }} --branch=main