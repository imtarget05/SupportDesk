name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          cd backend
          python -m pytest --tb=short
        env:
          AI_PROVIDER: stub
      - name: Secret leak scan
        run: |
          ! grep -rniI -E 'sk-[A-Za-z0-9]{20,}|BEGIN.*PRIVATE|cfut_' --exclude-dir=__pycache__ --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.terraform --exclude-dir=.codegraph --exclude-dir=.ai --exclude-dir=tasks --exclude=.env --exclude=.env.example --exclude=ci.yml --exclude=RECRUITER-EVIDENCE.md .
      - name: Alembic migration check
        run: |
          cd backend
          python -m alembic history
          # Offline SQL generation must use the PostgreSQL dialect. Batch
          # migrations (ALTER COLUMN etc.) require table reflection on SQLite,
          # which is impossible without a live DB in --sql mode. The
          # placeholder URL is never connected to — offline mode skips engine
          # creation entirely (see backend/alembic/env.py).
          DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
            python -m alembic upgrade head --sql > /dev/null
      - name: Evaluation smoke (stub provider)
        run: |
          AI_PROVIDER=stub python evaluation/evaluate.py
      - name: Eval regression gate (stub provider)
        run: |
          # Runs the full harness (classification, schema validity, guardrail
          # trip rate, cost, latency) and fails on a regression vs
          # evaluation/baseline.json. Offline: the stub provider needs no key.
          # An isolated SQLite file is migrated first because call tracing
          # persists one row per LLM call. Using Alembic (not create_all) means
          # this step also fails if a migration is broken.
          cd backend
          DATABASE_URL="sqlite:///./ci-eval.db" python -m alembic upgrade head
          cd ..
          AI_PROVIDER=stub DATABASE_URL="sqlite:///./backend/ci-eval.db" \
            python evaluation/eval_suite.py --check

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-gateway-${{ hashFiles('gateway/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-gateway-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run build
        run: |
          cd frontend
          npm run build
      - name: Run tests (if present)
        run: |
          cd frontend
          npm test --if-present

  gitleaks:
    # Secret scanning — HARD GATE (default config). Fails the build on leaks.
    # Ported from CreditFlow/SmartDoc (Phase 3 parity): the inline grep step
    # in `backend` stays as a fast local signal, but gitleaks is authoritative.
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
